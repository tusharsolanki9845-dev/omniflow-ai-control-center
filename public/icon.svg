<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Neural nodes & connective arcs -->
  <path d="M 176 186 Q 256 120 336 186 T 336 326 Q 256 392 176 326 Z" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Central Sparkle / Star of OmniFlow -->
  <path d="M 256 140 C 256 200 200 256 140 256 C 200 256 256 312 256 372 C 256 312 312 256 372 256 C 312 256 256 200 256 140 Z" fill="#ffffff" filter="url(#glow)"/>

  <!-- Orbit nodes -->
  <circle cx="176" cy="186" r="16" fill="#38bdf8"/>
  <circle cx="336" cy="186" r="16" fill="#c084fc"/>
  <circle cx="176" cy="326" r="16" fill="#818cf8"/>
  <circle cx="336" cy="326" r="16" fill="#f43f5e"/>
</svg>
