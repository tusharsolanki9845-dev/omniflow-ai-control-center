# Netlify Configuration for OmniFlow AI Control Center
[build]
  command = "npm run build"
  publish = "dist"

# Redirect rules for SPA Routing and API fallbacks
[[redirects]]
  from = "/api/download/apk"
  to = "/omniflow-v1.2-release.apk"
  status = 200

[[redirects]]
  from = "/api/apk/info"
  to = "/api/static-apk-info.json"
  status = 200

[[redirects]]
  from = "/api/vercel/status"
  to = "/api/static-vercel-status.json"
  status = 200

[[redirects]]
  from = "/api/netlify/status"
  to = "/api/static-vercel-status.json"
  status = 200

[[redirects]]
  from = "/api/github/status"
  to = "/api/static-github-status.json"
  status = 200

[[redirects]]
  from = "/api/system/metrics"
  to = "/api/static-system-metrics.json"
  status = 200

# Catch-all rewrite for Single Page App routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/omniflow-v1.2-release.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"OmniFlow-v1.2-release.apk\""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
